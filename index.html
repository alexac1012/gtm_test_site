<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CAPI Lead Form</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #E9DDF5;
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    color: #4B0082;
}

.container {
    text-align: center;
}

h1 {
    color: #4B0082;
    font-weight: bold;
    margin-bottom: 25px;
    font-family: Arial, sans-serif;
}

.form-container {
    border: 4px solid #4B0082;
    border-radius: 12px;
    padding: 30px;
    width: 500px;
    box-sizing: border-box;
    text-align: left;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
    color: #4B0082;
    font-family: Arial, sans-serif;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 18px;
    border: 1px solid #4B0082;
    border-radius: 6px;
    font-family: Arial, sans-serif;
    color: #4B0082;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 14px;
    background-color: #4B0082;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    font-family: Arial, sans-serif;
}

button:hover {
    opacity: 0.9;
}

/* THANK YOU PAGE */
.thankyou {
    font-family: "Brush Script MT", cursive;
    font-size: 64px;
    color: #4B0082;
    text-align: center;
}
</style>
</head>

<body>

<div class="container" id="form-page">

    <h1>Complete Your CAPI Lead Form</h1>

    <div class="form-container">

        <form id="test-form">

            <label for="first_name">First Name</label>
            <input type="text" id="first_name" required>

            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" required>

            <label for="li_fat_id">li_fat_id</label>
            <input type="text" id="li_fat_id">

            <label for="email">Email Address</label>
            <input type="email" id="email" required>

            <label for="job_title">Job Title</label>
            <input type="text" id="job_title">

            <label for="company">Company</label>
            <input type="text" id="company">

            <label for="country_code">2-Digit Country Code</label>
            <input type="text" id="country_code" maxlength="2" placeholder="US">

            <button type="submit">Submit</button>

        </form>

    </div>

</div>

<div id="thankyou-page" style="display:none;">
    <div class="thankyou">Thank you</div>
</div>

<script>
window.dataLayer = window.dataLayer || [];

async function sha256(value) {
    const encoder = new TextEncoder();
    const data = encoder.encode(value.trim().toLowerCase());

    const hashBuffer = await crypto.subtle.digest('SHA-256', data);

    return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, 2))
        .join('');
}

document.getElementById('test-form')
.addEventListener('submit', async function(e) {

    e.preventDefault();

    const email = document.getElementById('email').value;
    const hashedEmail = await sha256(email);

    dataLayer.push({
        event: 'form_submit',

        first_name: document.getElementById('first_name').value,
        last_name: document.getElementById('last_name').value,
        li_fat_id: document.getElementById('li_fat_id').value,

        // ✅ ONLY HASHED EMAIL IS SENT
        hashed_email: hashedEmail,

        job_title: document.getElementById('job_title').value,
        company: document.getElementById('company').value,
        country_code: document.getElementById('country_code').value.toUpperCase()
    });

    console.log(
        'Latest dataLayer event:',
        dataLayer[dataLayer.length - 1]
    );

    // show thank you page
    document.getElementById('form-page').style.display = 'none';
    document.getElementById('thankyou-page').style.display = 'flex';
    document.getElementById('thankyou-page').style.justifyContent = 'center';
    document.getElementById('thankyou-page').style.alignItems = 'center';
    document.getElementById('thankyou-page').style.height = '100vh';

});
</script>

</body>
</html>
