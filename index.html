<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CAPI Lead Form</title>

<!-- Ensure dataLayer exists BEFORE GTM loads -->
<script>
window.dataLayer = window.dataLayer || [];
</script>

<!-- Google Tag Manager -->
<script>
(function(w,d,s,l,i){
    w[l]=w[l]||[];

    w[l].push({
        'gtm.start': new Date().getTime(),
        event: 'gtm.js'
    });

    var f = d.getElementsByTagName(s)[0],
        j = d.createElement(s),
        dl = l != 'dataLayer' ? '&l=' + l : '';

    j.async = true;
    j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;

    j.onerror = function () {
        console.warn('GTM failed to load');
    };

    f.parentNode.insertBefore(j, f);

})(window, document, 'script', 'dataLayer', 'GTM-N2PCMDJZ');
</script>
<!-- End Google Tag Manager -->

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #E9DDF5;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #4B0082;
}

.container {
    text-align: center;
}

h1 {
    color: #4B0082;
    font-weight: bold;
    margin-bottom: 25px;
}

.form-container {
    border: 4px solid #4B0082;
    border-radius: 12px;
    padding: 30px;
    width: 500px;
    box-sizing: border-box;
    text-align: left;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 18px;
    border: 1px solid #4B0082;
    border-radius: 6px;
    color: #4B0082;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 14px;
    background-color: #4B0082;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.thankyou {
    font-family: "Brush Script MT", cursive;
    font-size: 64px;
    color: #4B0082;
    text-align: center;
}
</style>
</head>

<body>

<!-- GTM NoScript -->
<noscript>
<iframe
    src="https://www.googletagmanager.com/ns.html?id=GTM-N2PCMDJZ"
    height="0"
    width="0"
    style="display:none;visibility:hidden">
</iframe>
</noscript>
<!-- End GTM NoScript -->

<div class="container" id="form-page">

    <h1>Please Register for the Event</h1>

    <div class="form-container">

        <form id="test-form">

            <label>First Name</label>
            <input type="text" id="first_name" required>

            <label>Last Name</label>
            <input type="text" id="last_name" required>

            <label>Email Address</label>
            <input type="email" id="email" required>

            <label>Job Title</label>
            <input type="text" id="job_title">

            <label>Company</label>
            <input type="text" id="company">

            <label>2-Digit Country Code</label>
            <input
                type="text"
                id="country_code"
                maxlength="2"
                placeholder="US">

            <button type="submit">Submit</button>

        </form>

    </div>

</div>

<div id="thankyou-page" style="display:none;">
    <div class="thankyou">Thank You</div>
</div>

<script>
window.dataLayer = window.dataLayer || [];

/* Capture LinkedIn Click ID from URL */
const liFatId =
    new URLSearchParams(window.location.search)
        .get('li_fat_id') || null;

/* SHA256 helper for email only */
async function sha256(value) {

    const normalized =
        value.trim().toLowerCase();

    const buffer =
        await crypto.subtle.digest(
            'SHA-256',
            new TextEncoder().encode(normalized)
        );

    return Array.from(new Uint8Array(buffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
}

/* Generate event_id for deduplication */
function generateEventId() {

    if (crypto.randomUUID) {
        return crypto.randomUUID();
    }

    return (
        Date.now().toString(36) +
        Math.random().toString(36).slice(2)
    );
}

/* PAGE VIEW */
document.addEventListener('DOMContentLoaded', function () {

    const eventPayload = {
        event: 'page_view',
        event_id: generateEventId(),
        page_location: window.location.href,
        page_path: window.location.pathname,
        page_title: document.title,
        li_fat_id: liFatId
    };

    window.dataLayer.push(eventPayload);

    console.log('Page View fired');
    console.log(eventPayload);
    console.log(window.dataLayer);
});

/* LEAD FORM */
document
    .getElementById('test-form')
    .addEventListener('submit', async function (e) {

        e.preventDefault();

        try {

            const firstName =
                document.getElementById('first_name')
                    .value.trim();

            const lastName =
                document.getElementById('last_name')
                    .value.trim();

            const email =
                document.getElementById('email')
                    .value.trim();

            const jobTitle =
                document.getElementById('job_title')
                    .value.trim();

            const company =
                document.getElementById('company')
                    .value.trim();

            const country =
                document.getElementById('country_code')
                    .value
                    .trim()
                    .toUpperCase();

            /* Only email is hashed */
            const hashedEmail =
                await sha256(email);

            const eventPayload = {

                event: 'generate_lead',

                event_id: generateEventId(),

                form_name: 'event_registration',

                user_data: {

                    email: hashedEmail,

                    address: {
                        first_name: firstName,
                        last_name: lastName,
                        country: country || null
                    }
                },

                company: company || null,
                job_title: jobTitle || null,

                li_fat_id: liFatId
            };

            window.dataLayer.push(eventPayload);

            console.log('Lead fired');
            console.log(eventPayload);
            console.log(window.dataLayer);

            document.getElementById('form-page').style.display = 'none';

            const thankYou =
                document.getElementById('thankyou-page');

            thankYou.style.display = 'flex';
            thankYou.style.justifyContent = 'center';
            thankYou.style.alignItems = 'center';
            thankYou.style.height = '100vh';

        } catch (err) {

            console.error(
                'Form submit error',
                err
            );
        }
    });
</script>

</body>
</html>
