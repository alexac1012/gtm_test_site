<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CAPI Lead Form</title>

<script>
/* ---------------------------
   Initialize dataLayer
---------------------------- */
window.dataLayer = window.dataLayer || [];

const liFatId =
    new URLSearchParams(location.search).get('li_fat_id');

function generateEventId() {
    return crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now().toString(36) + Math.random().toString(36).slice(2);
}

/* ---------------------------
   Fire Page View AFTER GTM loads
---------------------------- */
function firePageView() {
    dataLayer.push({
        event: 'page_view',
        event_id: generateEventId(),
        page_location: location.href,
        page_path: location.pathname,
        page_title: document.title,
        li_fat_id: liFatId || null
    });

    console.log('Page View fired');
    console.log(dataLayer);
}

/* ---------------------------
   Load GTM FIRST
---------------------------- */
(function(w,d,s,l,i){
    w[l] = w[l] || [];

    w[l].push({
        'gtm.start': new Date().getTime(),
        event: 'gtm.js'
    });

    const f = d.getElementsByTagName(s)[0];
    const j = d.createElement(s);

    j.async = true;
    j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i;

    // ⭐ Critical: fire page_view ONLY after GTM is fully loaded
    j.onload = function() {
    window.addEventListener("load", firePageView);
};

    j.onerror = function () {
        console.warn('GTM failed to load');
    };

    f.parentNode.insertBefore(j, f);

})(window, document, 'script', 'dataLayer', 'GTM-N2PCMDJZ');

/* ---------------------------
   SHA-256 hashing
---------------------------- */
async function sha256(value) {
    const data = new TextEncoder()
        .encode(value.trim().toLowerCase());

    const hash = await crypto.subtle.digest('SHA-256', data);

    return [...new Uint8Array(hash)]
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
}
</script>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #E9DDF5;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #4B0082;
}

.container {
    text-align: center;
}

h1 {
    color: #4B0082;
    font-weight: bold;
    margin-bottom: 25px;
}

.form-container {
    border: 4px solid #4B0082;
    border-radius: 12px;
    padding: 30px;
    width: 500px;
    box-sizing: border-box;
    text-align: left;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 18px;
    border: 1px solid #4B0082;
    border-radius: 6px;
    color: #4B0082;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 14px;
    background-color: #4B0082;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.thankyou {
    font-family: "Brush Script MT", cursive;
    font-size: 64px;
    color: #4B0082;
    text-align: center;
}
</style>
</head>

<body>

<noscript>
<iframe
    src="https://www.googletagmanager.com/ns.html?id=GTM-N2PCMDJZ"
    height="0"
    width="0"
    style="display:none;visibility:hidden">
</iframe>
</noscript>

<div class="container" id="form-page">

    <h1>Please Register for the Event</h1>

    <div class="form-container">

        <form id="test-form">

            <input
                type="hidden"
                id="li_fat_id"
                name="li_fat_id">

            <label>First Name</label>
            <input type="text" id="first_name" required>

            <label>Last Name</label>
            <input type="text" id="last_name" required>

            <label>Email Address</label>
            <input type="email" id="email" required>

            <label>Job Title</label>
            <input type="text" id="job_title">

            <label>Company</label>
            <input type="text" id="company">

            <label>2-Digit Country Code</label>
            <input
                type="text"
                id="country_code"
                maxlength="2"
                placeholder="US">

            <button type="submit">Submit</button>

        </form>

    </div>

</div>

<div id="thankyou-page" style="display:none;">
    <div class="thankyou">Thank You</div>
</div>

<script>
/* Pre-fill hidden li_fat_id */
document.getElementById('li_fat_id').value =
    liFatId || '';

/* ---------------------------
   FORM SUBMIT → generate_lead
---------------------------- */
document
    .getElementById('test-form')
    .addEventListener('submit', async function (e) {

        e.preventDefault();

        try {

            const firstName =
                document.getElementById('first_name')
                    .value.trim();

            const lastName =
                document.getElementById('last_name')
                    .value.trim();

            const email =
                document.getElementById('email')
                    .value.trim();

            const jobTitle =
                document.getElementById('job_title')
                    .value.trim();

            const company =
                document.getElementById('company')
                    .value.trim();

            const country =
                document.getElementById('country_code')
                    .value
                    .trim()
                    .toUpperCase();

            /* ---------------------------
               CLEANED generate_lead payload
               (consistent, server-friendly)
            ---------------------------- */
            dataLayer.push({
                event: 'generate_lead',
                event_id: generateEventId(),
                form_name: 'event_registration',

                user_data: {
                    email: await sha256(email),
                    first_name: firstName || null,
                    last_name: lastName || null,
                    country: country || null
                },

                company: company || null,
                job_title: jobTitle || null,
                li_fat_id: liFatId || null
            });

            console.log('Lead fired');
            console.log(dataLayer);

            /* Show thank-you page */
            document.getElementById('form-page').style.display = 'none';

            const thankYou =
                document.getElementById('thankyou-page');

            thankYou.style.display = 'flex';
            thankYou.style.justifyContent = 'center';
            thankYou.style.alignItems = 'center';
            thankYou.style.height = '100vh';

        } catch (err) {

            console.error('Form submit error', err);

        }

    });
</script>

</body>
</html>
