<body>

<h1>Complete Your CAPI Lead Form</h1>

<form id="test-form">

    <label for="first_name">First Name</label>
    <input type="text" id="first_name" required>

    <label for="last_name">Last Name</label>
    <input type="text" id="last_name" required>

    <label for="li_fat_id">li_fat_id</label>
    <input type="text" id="li_fat_id">

    <label for="email">Email Address</label>
    <input type="email" id="email" required>

    <label for="job_title">Job Title</label>
    <input type="text" id="job_title">

    <label for="company">Company</label>
    <input type="text" id="company">

    <label for="country_code">2-Digit Country Code</label>
    <input type="text" id="country_code" maxlength="2" placeholder="US">

    <button type="submit">Submit</button>

</form>

<script>
window.dataLayer = window.dataLayer || [];

async function sha256(value) {
    const encoder = new TextEncoder();
    const data = encoder.encode(value.trim().toLowerCase());

    const hashBuffer = await crypto.subtle.digest(
        'SHA-256',
        data
    );

    return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
}

document.getElementById('test-form').addEventListener('submit', async function(e) {

    e.preventDefault();

    const email = document.getElementById('email').value;
    const hashedEmail = await sha256(email);

    dataLayer.push({
        event: 'form_submit',

        first_name: document.getElementById('first_name').value,
        last_name: document.getElementById('last_name').value,
        li_fat_id: document.getElementById('li_fat_id').value,
        email: email,
        hashed_email: hashedEmail,
        job_title: document.getElementById('job_title').value,
        company: document.getElementById('company').value,
        country_code: document.getElementById('country_code').value.toUpperCase()
    });

    console.log(
        'Latest dataLayer event:',
        dataLayer[dataLayer.length - 1]
    );

    alert('Form submitted. Check the console.');
});
</script>

</body>
</html>
