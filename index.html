<script>
window.dataLayer = window.dataLayer || [];

async function sha256(value) {
    const encoder = new TextEncoder();

    const data = encoder.encode(
        value.trim().toLowerCase()
    );

    const hashBuffer = await crypto.subtle.digest(
        'SHA-256',
        data
    );

    return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
}

document.getElementById('test-form')
.addEventListener('submit', async function(e) {

    e.preventDefault();

    const firstName =
        document.getElementById('first_name').value.trim();

    const lastName =
        document.getElementById('last_name').value.trim();

    const email =
        document.getElementById('email').value.trim();

    const company =
        document.getElementById('company').value.trim();

    const jobTitle =
        document.getElementById('job_title').value.trim();

    const liFatId =
        document.getElementById('li_fat_id').value.trim();

    const country =
        document.getElementById('country_code')
            .value
            .trim()
            .toUpperCase();

    const hashedEmail = await sha256(email);
    const hashedFirstName = await sha256(firstName);
    const hashedLastName = await sha256(lastName);

    dataLayer.push({

        event: 'generate_lead',

        form_name: 'event_registration',

        user_data: {
            email: hashedEmail,

            address: {
                first_name: hashedFirstName,
                last_name: hashedLastName,
                country: country
            }
        },

        company: company,
        job_title: jobTitle,
        li_fat_id: liFatId

    });

    console.log(
        'Latest dataLayer event:',
        dataLayer[dataLayer.length - 1]
    );

    document.getElementById('form-page').style.display = 'none';

    document.getElementById('thankyou-page').style.display = 'flex';
    document.getElementById('thankyou-page').style.justifyContent = 'center';
    document.getElementById('thankyou-page').style.alignItems = 'center';
    document.getElementById('thankyou-page').style.height = '100vh';

});
</script>
